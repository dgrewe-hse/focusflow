# Test Profile Configuration
# ===================================================================

# Use in-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.de.hse.focusflow=DEBUG

# Security Configuration
spring.security.csrf.enabled=false

# JWT Configuration for testing
jwt.secret=testingjwtsecretkeyforsecuritytestingpurposesonly12345
jwt.expiration=3600000

# Disable Flyway for tests
spring.flyway.enabled=false

# Caching - disable during tests
spring.cache.type=none

# Enable H2 console for debugging (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration - Use schema.sql instead of Hibernate schema generation
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Hibernate properties for camelCase naming (matches our Java property names)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Disable PostgreSQL-specific features
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
